; nvtop settings. Only what differs from nvtop's defaults; everything else stays default.
; Sort processes by device, lowest first, so the NVIDIA GPU's processes (device 0) sit at the top.
; Edit this file by hand. F12 in nvtop overwrites it through the symlink: it drops these comments, adds
; [Device] sections with PCI addresses, and has been seen to save SortBy = none.
[ProcessListOption]
SortOrder = ascending
SortBy = gpuId
