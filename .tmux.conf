##### Keybinding reference #####
#
# Keep this table updated whenever a keybinding is added, removed, or changed.
#
# tmux works like i3 here: a tmux pane is an i3 window, and a tmux window is an i3 workspace.
# Where i3 has Alt+key, tmux has Ctrl+b, then key.
#
# Action                        | i3                | tmux
# ------------------------------|-------------------|--------------------------------
# Focus left/down/up/right      | Alt+h/j/k/l       | Ctrl+b, h/j/k/l
# Move left/down/up/right       | Alt+Shift+h/j/k/l | Ctrl+b, Shift+h/j/k/l
# New pane beside this one      | Alt+Enter         | Ctrl+b, Enter
# Split left/right              | Alt+b             | Ctrl+b, b
# Split top/bottom              | Alt+v             | Ctrl+b, v
# Tabbed                        | Alt+w             | Ctrl+b, w
# Split again / flip split      | Alt+e             | Ctrl+b, e
# Fullscreen / zoom             | Alt+f             | Ctrl+b, f
# Go to window 1-10             | Alt+1..0          | Ctrl+b, 1..0
# Move pane to window 1-10      | Alt+Shift+1..0    | Ctrl+b, Shift+1..0
# Pull window 1-10 in here      |                   | Ctrl+b, m, then 1..0
# Pull a window or pane (list)  |                   | Ctrl+b, m, m
# Resize                        | Alt+r, h/j/k/l    | Ctrl+b, r, then h/j/k/l (Escape to stop)
# Close pane                    | Alt+Shift+q       | Ctrl+b, q
# Close the whole window        |                   | Ctrl+b, Shift+q (asks first if it has 2+ panes)
# Reload config                 | Alt+Shift+c       | Ctrl+b, Shift+c
# Copy to the clipboard         |                   | Drag with the mouse (or Ctrl+b, [, then v ... y)
#
# You can keep holding Ctrl the whole way, like holding Alt in i3: Ctrl+b, Ctrl+l works like
# Ctrl+b, l, for h/j/k/l, Enter, v, w, e, f, r and q. Then tap Ctrl+h/j/k/l again to keep moving
# focus, or Shift+h/j/k/l again after a move, without another Ctrl+b (for half a second, while
# the session name is blue). Let go of Ctrl for b (Ctrl+b, Ctrl+b sends Ctrl+b to the program),
# m (Ctrl+m is Enter), the numbers (Ctrl+digits send other keys) and anything with Shift (the
# terminal keeps Ctrl+Shift keys for itself: Ctrl+Shift+q closes it).
#
# In a tabbed window: h/k and l/j go to the previous and next tab, Shift+h/k and Shift+l/j move
# the tab earlier and later, Enter/b/v open a new tab, and f hides or shows the tab bar.
#
# Needs tmux 3.2 or newer (Ubuntu 22.04's).


##### General behavior #####

# Enable mouse support in tmux
set -g mouse on

# Large scrollback buffer
set -g history-limit 100000

# Vim-style keys in copy mode
setw -g mode-keys vi

# Reduce Escape-key delay
set -sg escape-time 0

# Number windows/panes starting at 1. Windows keep their numbers like i3 workspaces: closing
# window 2 leaves a gap rather than renumbering 3 to 2, so Ctrl+b, 3 still goes where it did.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows off


##### Terminal / colors #####

# Modern tmux terminal type
set -g default-terminal "tmux-256color"

# Truecolor support
set -as terminal-features ",*:RGB"

# Title the terminal window with the active pane's title, which its program sets. Claude Code
# puts its session's title there, and the i3 bar uses it to tell when you're looking at a
# session, and to find its window when you two-finger tap it (right click) in the bar
# (.scripts/i3status_stt.sh in the dotfiles).
set -g set-titles on
set -g set-titles-string "#{pane_title}"

# Left of the window list: the session name turns blue while Ctrl+b waits for its key (in place,
# so the window list doesn't shift), and i3's red mode badge shows while resizing or picking a
# window to pull in.
set -g status-left-length 40
set -g status-left '#{?#{==:#{client_key_table},resize},#[fg=#ffffff]#[bg=#900000] resize #[default] ,}#{?#{==:#{client_key_table},pull},#[fg=#ffffff]#[bg=#900000] pull in: 1-0 or m #[default] ,}#{?#{==:#{client_key_table},prefix},#[fg=#ffffff]#[bg=#285577],}[#S]#[default] '


##### Focus (Ctrl+b, h/j/k/l) #####

# In a tabbed window, h/k go to the previous tab and l/j to the next, wrapping around.
# With Ctrl held (Ctrl+b, Ctrl+l), tap Ctrl+l again to keep going (-r: no Ctrl+b needed for half
# a second). Plain h/j/k/l don't repeat, so typing right after switching panes isn't eaten.
bind h if -F '#{@tabbed}' { select-pane -Z -t :.- } { select-pane -L }
bind j if -F '#{@tabbed}' { select-pane -Z -t :.+ } { select-pane -D }
bind k if -F '#{@tabbed}' { select-pane -Z -t :.- } { select-pane -U }
bind l if -F '#{@tabbed}' { select-pane -Z -t :.+ } { select-pane -R }
bind -r C-h if -F '#{@tabbed}' { select-pane -Z -t :.- } { select-pane -L }
bind -r C-j if -F '#{@tabbed}' { select-pane -Z -t :.+ } { select-pane -D }
bind -r C-k if -F '#{@tabbed}' { select-pane -Z -t :.- } { select-pane -U }
bind -r C-l if -F '#{@tabbed}' { select-pane -Z -t :.+ } { select-pane -R }


##### Move (Ctrl+b, Shift+h/j/k/l) #####

# Trade places with the pane on that side. At the window's edge, take up that whole edge
# instead, so Shift+j on the right half of a left/right split puts it along the bottom, as in i3.
# A fullscreen pane comes out of fullscreen first. In a tabbed window, move the tab earlier (h/k)
# or later (l/j). Tap Shift+h/j/k/l again to keep moving it (-r: no Ctrl+b needed for half a
# second).
bind -r H if -F '#{@tabbed}' {
    if -F '#{!=:#{pane_index},1}' { swap-pane -Zd -t :.- }
} {
    if -F '#{window_zoomed_flag}' { resize-pane -Z }
    if -F '#{pane_at_left}' {
        if -F '#{?pane_at_top,#{?pane_at_bottom,0,1},1}' { move-pane -fhb -t :.+ }
    } { swap-pane -d -t '{left-of}' }
}
bind -r L if -F '#{@tabbed}' {
    if -F '#{!=:#{pane_index},#{window_panes}}' { swap-pane -Zd -t :.+ }
} {
    if -F '#{window_zoomed_flag}' { resize-pane -Z }
    if -F '#{pane_at_right}' {
        if -F '#{?pane_at_top,#{?pane_at_bottom,0,1},1}' { move-pane -fh -t :.+ }
    } { swap-pane -d -t '{right-of}' }
}
bind -r K if -F '#{@tabbed}' {
    if -F '#{!=:#{pane_index},1}' { swap-pane -Zd -t :.- }
} {
    if -F '#{window_zoomed_flag}' { resize-pane -Z }
    if -F '#{pane_at_top}' {
        if -F '#{?pane_at_left,#{?pane_at_right,0,1},1}' { move-pane -fvb -t :.+ }
    } { swap-pane -d -t '{up-of}' }
}
bind -r J if -F '#{@tabbed}' {
    if -F '#{!=:#{pane_index},#{window_panes}}' { swap-pane -Zd -t :.+ }
} {
    if -F '#{window_zoomed_flag}' { resize-pane -Z }
    if -F '#{pane_at_bottom}' {
        if -F '#{?pane_at_left,#{?pane_at_right,0,1},1}' { move-pane -fv -t :.+ }
    } { swap-pane -d -t '{down-of}' }
}


##### New panes #####

# Ctrl+b, Enter: a new pane beside this one, evened out with the panes in its row, the way a new
# i3 window shares its container. In a tabbed window it's a new tab. (Ctrl+Enter is the same key
# to tmux, so it works with Ctrl held too.)
bind Enter { split-window -h -c "#{pane_current_path}" ; select-layout -E }

# Ctrl+b, b = left/right, Ctrl+b, v = top/bottom: split this pane in half.
# In a tabbed window, both open a new tab, like Enter.
bind b if -F '#{@tabbed}' { split-window -h -c "#{pane_current_path}" ; select-layout -E } { split-window -h -c "#{pane_current_path}" }
bind v if -F '#{@tabbed}' { split-window -h -c "#{pane_current_path}" ; select-layout -E } { split-window -v -c "#{pane_current_path}" }
bind C-v if -F '#{@tabbed}' { split-window -h -c "#{pane_current_path}" ; select-layout -E } { split-window -v -c "#{pane_current_path}" }


##### Layout: tabbed, split, fullscreen #####

# Each of these is a named command (command-alias) bound to both the key and Ctrl+key. Bind the
# bare name, not inside { }, or tmux 3.4 won't know it (see Windows below).

# Ctrl+b, w: tabbed. One pane at a time fills the window, under a tab bar in i3's tab colors.
# Underneath it's tmux's zoom plus the window's @tabbed flag. tmux unzooms whenever a pane
# closes, splits or joins, so the hook zooms the active pane again while the flag is set.
# The hidden tabs keep their old split sizes, so a program in one redraws when you switch to it.
set -s command-alias[103] 'layout-tabbed=set -w @tabbed 1 ; set -w pane-border-status top ; if -F "#{window_zoomed_flag}" {} { resize-pane -Z }'
bind w layout-tabbed
bind C-w layout-tabbed
# (The hook's own pane is the one active when tmux unzoomed, before a split's new pane, so it
# zooms whichever pane is active in the window by the time it runs.)
set-hook -g window-layout-changed 'if -F "#{&&:#{@tabbed},#{?window_zoomed_flag,0,1}}" { run -C "resize-pane -Z -t #{window_id}" }'

# Ctrl+b, e: from tabbed, back to the split the panes had before. Otherwise flip between side by
# side and stacked (a pane spanning the window's whole width means they're stacked now).
set -s command-alias[104] 'layout-split=if -F "#{@tabbed}" {
    set -wu @tabbed ; set -wu pane-border-status ; if -F "#{window_zoomed_flag}" { resize-pane -Z }
} {
    if -F "#{&&:#{pane_at_left},#{pane_at_right}}" { select-layout even-horizontal } { select-layout even-vertical }
}'
bind e layout-split
bind C-e layout-split

# Ctrl+b, f: fullscreen this pane (tmux's zoom). A tab already fills the window, so in a tabbed
# window f hides or shows the tab bar instead.
set -s command-alias[105] 'layout-fullscreen=if -F "#{@tabbed}" {
    if -F "#{==:#{pane-border-status},top}" { set -w pane-border-status off } { set -w pane-border-status top }
} { resize-pane -Z }'
bind f layout-fullscreen
bind C-f layout-fullscreen

# The tab bar is the zoomed pane's top border: each tab is an even share of the width, showing the
# title the program set (Claude Code's session title), or else the command and its folder.
set -g @tab-label '#{?#{||:#{m:*sh,#{pane_current_command}},#{||:#{==:#{pane_title},},#{==:#{pane_title},#{host}}}},#{pane_current_command} #{b:pane_current_path},#{pane_title}}'
set -g @tab-width '#{e|-:#{e|/:#{window_width},#{window_panes}},1}'
set -g @tab ' #{E;=/#{e|-:#{E:@tab-width},2}/…:@tab-label}#{p1000:@no-such-option}'
set -g pane-border-format '#{P:#[fg=#888888]#[bg=#222222]#{E;=/#{E:@tab-width}/:@tab}#[default] ,#[fg=#ffffff]#[bg=#285577]#{E;=/#{E:@tab-width}/:@tab}#[default] }'


##### Windows (i3 workspaces) #####

# These take the window number from @n, and run -C turns the format into the command to run,
# since tmux doesn't fill in formats inside -t targets. @window-n is window @n's id, or empty.
# (Not a command-alias: tmux 3.4 reads { } blocks before running the file, so an alias set in
# this file isn't known inside them, and one unknown command stops the whole file loading.)
set -g @window-n '#{W:#{?#{==:#{window_index},#{@n}},#{window_id},}}'

# Ctrl+b, 1-9 and 0: go to window 1-10, making it (in this pane's folder) if it isn't there.
set -g @go-to-window '#{?#{E:@window-n},select-window -t #{E:@window-n},new-window -t :#{@n} -c "#{l:#{pane_current_path}}"}'
bind 1 { set -g @n 1 ; run -C "#{E:@go-to-window}" }
bind 2 { set -g @n 2 ; run -C "#{E:@go-to-window}" }
bind 3 { set -g @n 3 ; run -C "#{E:@go-to-window}" }
bind 4 { set -g @n 4 ; run -C "#{E:@go-to-window}" }
bind 5 { set -g @n 5 ; run -C "#{E:@go-to-window}" }
bind 6 { set -g @n 6 ; run -C "#{E:@go-to-window}" }
bind 7 { set -g @n 7 ; run -C "#{E:@go-to-window}" }
bind 8 { set -g @n 8 ; run -C "#{E:@go-to-window}" }
bind 9 { set -g @n 9 ; run -C "#{E:@go-to-window}" }
bind 0 { set -g @n 10 ; run -C "#{E:@go-to-window}" }

# Ctrl+b, Shift+1-9 and Shift+0: move this pane to window 1-10 (made if it isn't there) and stay
# here, as in i3. If it was this window's only pane, go with it. In a tabbed window it's a new tab.
set -g @move-to-window '#{?#{E:@window-n},#{?#{==:#{window_index},#{@n}},display "already in window #{@n}",join-pane -h#{?#{==:#{window_panes},1},, -d} -t #{E:@window-n} ; select-layout -E -t #{E:@window-n}},break-pane#{?#{==:#{window_panes},1},, -d} -t :#{@n}}'
bind '!' { set -g @n 1 ; run -C "#{E:@move-to-window}" }
bind '@' { set -g @n 2 ; run -C "#{E:@move-to-window}" }
bind '#' { set -g @n 3 ; run -C "#{E:@move-to-window}" }
bind '$' { set -g @n 4 ; run -C "#{E:@move-to-window}" }
bind '%' { set -g @n 5 ; run -C "#{E:@move-to-window}" }
bind '^' { set -g @n 6 ; run -C "#{E:@move-to-window}" }
bind '&' { set -g @n 7 ; run -C "#{E:@move-to-window}" }
bind '*' { set -g @n 8 ; run -C "#{E:@move-to-window}" }
bind '(' { set -g @n 9 ; run -C "#{E:@move-to-window}" }
bind ')' { set -g @n 10 ; run -C "#{E:@move-to-window}" }

# Ctrl+b, m, then 1-9 or 0: pull all of window 1-10's panes into this window, beside this pane
# (as tabs, if this window is tabbed), and go to the last one.
# Ctrl+b, m, m: pick a window or a single pane to pull in from a list instead.
# @pull-window runs in the window being emptied; @pull-to is the window they go to.
set -g @pull-window '#{P:join-pane -h -s #{pane_id} -t #{@pull-to} ; select-layout -E -t #{@pull-to} ; }'
set -g @pull-in-window '#{?#{E:@window-n},#{?#{==:#{window_index},#{@n}},display "already in window #{@n}",#{W:#{?#{==:#{window_index},#{@n}},#{E:@pull-window},}}},display "no window #{@n}"}'
bind m { set -gF @pull-to '#{window_id}' ; switch-client -T pull }
bind -T pull 1 { set -g @n 1 ; run -C "#{E:@pull-in-window}" }
bind -T pull 2 { set -g @n 2 ; run -C "#{E:@pull-in-window}" }
bind -T pull 3 { set -g @n 3 ; run -C "#{E:@pull-in-window}" }
bind -T pull 4 { set -g @n 4 ; run -C "#{E:@pull-in-window}" }
bind -T pull 5 { set -g @n 5 ; run -C "#{E:@pull-in-window}" }
bind -T pull 6 { set -g @n 6 ; run -C "#{E:@pull-in-window}" }
bind -T pull 7 { set -g @n 7 ; run -C "#{E:@pull-in-window}" }
bind -T pull 8 { set -g @n 8 ; run -C "#{E:@pull-in-window}" }
bind -T pull 9 { set -g @n 9 ; run -C "#{E:@pull-in-window}" }
bind -T pull 0 { set -g @n 10 ; run -C "#{E:@pull-in-window}" }
# The list gives '=session:window.' for a window and '=session:window.%pane' for a pane, in place
# of each %1 (it only fills in the first %%).
set -g @pull-picked '#{?#{==:#{window_id},#{@pull-to}},display "already in this window",#{?#{m:*.%*,#{@picked}},join-pane -h -s #{pane_id} -t #{@pull-to} ; select-layout -E -t #{@pull-to},#{E:@pull-window}}}'
bind -T pull m choose-tree -Zw "set -g @picked '%1' ; run -C -t '%1' '#{E:@pull-picked}'"


##### Resize (Ctrl+b, r) #####

# Like i3's resize mode: h/l make this pane narrower/wider and j/k shorter/taller (arrow keys
# too, and with Ctrl held), until Escape, Enter or r. Any other key also leaves.
bind r switch-client -T resize
bind C-r switch-client -T resize
bind -T resize h { run -C 'resize-pane -x #{e|-:#{pane_width},5}' ; switch-client -T resize }
bind -T resize l { run -C 'resize-pane -x #{e|+:#{pane_width},5}' ; switch-client -T resize }
bind -T resize j { run -C 'resize-pane -y #{e|-:#{pane_height},5}' ; switch-client -T resize }
bind -T resize k { run -C 'resize-pane -y #{e|+:#{pane_height},5}' ; switch-client -T resize }
bind -T resize Left { run -C 'resize-pane -x #{e|-:#{pane_width},5}' ; switch-client -T resize }
bind -T resize Right { run -C 'resize-pane -x #{e|+:#{pane_width},5}' ; switch-client -T resize }
bind -T resize Down { run -C 'resize-pane -y #{e|-:#{pane_height},5}' ; switch-client -T resize }
bind -T resize Up { run -C 'resize-pane -y #{e|+:#{pane_height},5}' ; switch-client -T resize }
bind -T resize C-h { run -C 'resize-pane -x #{e|-:#{pane_width},5}' ; switch-client -T resize }
bind -T resize C-l { run -C 'resize-pane -x #{e|+:#{pane_width},5}' ; switch-client -T resize }
bind -T resize C-j { run -C 'resize-pane -y #{e|-:#{pane_height},5}' ; switch-client -T resize }
bind -T resize C-k { run -C 'resize-pane -y #{e|+:#{pane_height},5}' ; switch-client -T resize }
bind -T resize Escape switch-client -T root
bind -T resize Enter switch-client -T root
bind -T resize r switch-client -T root
bind -T resize C-r switch-client -T root


##### Misc #####

# Ctrl+b, q = close this pane, like i3's kill. When a window's last pane closes, the window goes.
bind q kill-pane
bind C-q kill-pane

# Ctrl+b, Shift+q = close the whole window and everything running in it. With more than one pane
# it asks first (y closes, any other key doesn't). Closing the only window ends tmux.
bind Q if -F '#{==:#{window_panes},1}' kill-window { confirm-before -p "close window #I and its #{window_panes} panes? (y/n)" kill-window }

# tmux's Ctrl+b, Ctrl+z suspends tmux and leaves the terminal looking frozen, and is easy to hit
# with Ctrl held, so it's off.
unbind C-z

# Copies (dragging with the mouse, double-clicking a word, triple-clicking a line, or y or Enter in
# copy mode) also go to the clipboard, ready for Ctrl+Shift+v or Ctrl+v elsewhere. GNOME Terminal
# ignores tmux's usual way of passing copies on, so this hands them to xclip. On a server with no
# display, copies stay in tmux (Ctrl+b, ] pastes them).
if 'command -v xclip >/dev/null && [ -n "$DISPLAY" ]' { set -s copy-command 'xclip -selection clipboard -i' }

# In copy mode (Ctrl+b, [ or scrolling up with the mouse), v starts a selection and y copies it,
# like vim (Ctrl+v for a block).
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# Ctrl+b, Shift+c = reload config
bind C { source-file ~/.tmux.conf ; display-message "tmux config reloaded" }
