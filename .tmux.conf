##### Keybinding reference #####
#
# Keep this table updated whenever a keybinding is added, removed, or changed.
#
# Action              | i3              | tmux
# --------------------|-----------------|------------------
# Focus left          | Alt+h           | Ctrl+b, h
# Focus down          | Alt+j           | Ctrl+b, j
# Focus up            | Alt+k           | Ctrl+b, k
# Focus right         | Alt+l           | Ctrl+b, l
# Split left/right    | Alt+b           | Ctrl+b, b
# Split top/bottom    | Alt+v           | Ctrl+b, v
# Resize left         | resize + h      | Ctrl+b, Shift+h
# Resize down         | resize + j      | Ctrl+b, Shift+j
# Resize up           | resize + k      | Ctrl+b, Shift+k
# Resize right        | resize + l      | Ctrl+b, Shift+l
# Fullscreen / zoom   | Alt+f           | Ctrl+b, f
# Kill pane/window    | Alt+Shift+q     | Ctrl+b, q
# Reload config       | Alt+Shift+c     | Ctrl+b, r
#

##### General behavior #####

# Enable mouse support in tmux
set -g mouse on

# Large scrollback buffer
set -g history-limit 100000

# Vim-style keys in copy mode
setw -g mode-keys vi

# Reduce Escape-key delay
set -sg escape-time 0


##### Terminal / colors #####

# Modern tmux terminal type
set -g default-terminal "tmux-256color"

# Truecolor support
set -as terminal-features ",*:RGB"


##### i3-style pane navigation #####

# Ctrl+b, h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


##### Splitting #####

# Ctrl+b, b = left/right
bind b split-window -h -c "#{pane_current_path}"

# Ctrl+b, v = top/bottom
bind v split-window -v -c "#{pane_current_path}"


##### Resize #####

# Ctrl+b, Shift+h/j/k/l
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


##### Misc #####

# Ctrl+b, f = fullscreen current pane
bind f resize-pane -Z

# Ctrl+b, q = kill pane
bind q kill-pane

# Ctrl+b, r = reload config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Number windows/panes starting at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
